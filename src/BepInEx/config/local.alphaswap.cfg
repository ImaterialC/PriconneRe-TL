## Settings file was created by plugin AlphaSwap v1.0.0
## Plugin GUID: local.alphaswap

[General]

## How often to scan loaded textures.
# Setting type: Single
# Default value: 1
ScanIntervalSeconds = 1

## Comma-separated. Only PNG files whose name starts with one of these are used.
# Setting type: String
# Default value: tx_uTex_,card_illust_,caravan_buddy_
NamePrefixes = tx_uTex_dear_level_up_,card_illust_,chara_name_,chara_serif_

## Value used for {Lang} in folder paths. Leave empty to read 'Language=' from XUnity's AutoTranslatorConfig.ini (fallback: en).
# Setting type: String
# Default value: 
Language = 

## Extra folders to read PNGs from (subfolders included), separated by | . Absolute paths, or relative to the game folder. {Lang} = language code. Example: BepInEx\Translation\{Lang}\Other\Alpha|D:\MyTextures
# Setting type: String
# Default value: BepInEx\Translation\{Lang}\Other\Alpha
ExtraFolders = BepInEx\Translation\{Lang}\Other\Alpha

